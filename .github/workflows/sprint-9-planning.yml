name: Sprint 9 planning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-9-planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-boundary:
    name: Notifications planning boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check Sprint 9 planning boundaries
        run: python scripts/ci/check-sprint-9-planning.py
