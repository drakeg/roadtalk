name: Sprint 9 planning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-9-planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-boundary:
    name: Notifications planning boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Check Sprint 9 planning boundaries
        run: python scripts/ci/check-sprint-9-planning.py
