name: Sprint 8 hardening

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-8-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-presence-hardening:
    name: Map/presence hardening and scale
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: roadtalk_test
          POSTGRES_USER: roadtalk
          POSTGRES_PASSWORD: roadtalk_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtalk -d roadtalk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://roadtalk:roadtalk_ci_only@localhost:5432/roadtalk_test
      ROADTALK_ENVIRONMENT: test
      ROADTALK_DATABASE_CHECK_ENABLED: "false"
      ROADTALK_LOG_LEVEL: CRITICAL
      ROADTALK_RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e 'backend[dev]'
      - name: Upgrade disposable database
        working-directory: backend
        run: alembic upgrade head
      - name: Report Sprint 8 presence synthetic scale
        working-directory: backend
        run: pytest -q -s tests/test_presence_scale.py
      - name: Check Sprint 8 map/presence hardening
        run: python scripts/ci/check-map-presence-hardening.py
