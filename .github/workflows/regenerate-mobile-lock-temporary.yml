name: Regenerate mobile lockfile temporary

on:
  push:
    branches:
      - agent/fix-decode-uri-component
    paths:
      - .github/workflows/regenerate-mobile-lock-temporary.yml
      - mobile/package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/fix-decode-uri-component
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate lockfile only
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Regenerate mobile lockfile for decode-uri-component"
          git push origin HEAD:agent/fix-decode-uri-component
