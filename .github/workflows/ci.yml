name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, database, and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: roadtalk_test
          POSTGRES_USER: roadtalk
          POSTGRES_PASSWORD: roadtalk_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtalk -d roadtalk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://roadtalk:roadtalk_ci_only@localhost:5432/roadtalk_test
      ROADTALK_ENVIRONMENT: test
      ROADTALK_DATABASE_CHECK_ENABLED: "false"
      ROADTALK_LOG_LEVEL: CRITICAL
      ROADTALK_RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e 'backend[dev]'
      - name: Check formatting
        run: ruff format --check backend
      - name: Lint
        run: ruff check backend
      - name: Type-check
        working-directory: backend
        run: mypy app tests
      - name: Upgrade empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Check schema drift
        id: schema
        working-directory: backend
        run: |
          set +e
          alembic check > "$RUNNER_TEMP/schema-drift.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/schema-drift.txt"
          if [ "$status" -ne 0 ]; then
            diagnostic="$(tail -n 1 "$RUNNER_TEMP/schema-drift.txt" | base64 -w0 | cut -c1-180)"
            echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Preserve schema drift report
        if: ${{ failure() && steps.schema.outputs.diagnostic != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: schema-drift-${{ steps.schema.outputs.diagnostic }}
          path: ${{ runner.temp }}/schema-drift.txt
          retention-days: 1
      - name: Run backend tests
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=term-missing
      - name: Report Sprint 4 synthetic grant scale
        working-directory: backend
        run: pytest -q -s tests/test_ptt_scale.py
      - name: Report Sprint 5 synthetic proximity scale
        working-directory: backend
        run: pytest -q -s tests/test_ptt_proximity_scale.py
      - name: Report Sprint 6 synthetic channel scale
        working-directory: backend
        run: pytest -q -s tests/test_channel_scale.py
      - name: Verify downgrade and forward migration
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  mobile:
    name: Mobile quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Expo project
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npm run doctor
      - name: Type-check
        run: npm run typecheck
      - name: Run mobile tests
        run: npm test -- --watch=false

  security:
    name: Dependencies, secrets, containers, and IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
        with:
          tflint_version: v0.59.1
      - name: Validate local Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet
          BACKEND_PORT=18000 docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/compose.json"
          ROADTALK_LAN_HOST=10.0.0.25 docker compose -f compose.yaml -f compose.lan.yaml --env-file .env.example config --format json > "$RUNNER_TEMP/compose-lan.json"
          docker run --rm -e ROADTALK_LAN_HOST=10.0.0.25 -e ROADTALK_LAN_HTTPS_PORT=8443 -v "$PWD/deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("compose.json").read_text())
          ports = config["services"]["backend"]["ports"]
          if not any(
              str(port.get("target")) == "8000"
              and str(port.get("published")) == "18000"
              and port.get("host_ip") == "127.0.0.1"
              for port in ports
          ):
              raise SystemExit("custom BACKEND_PORT did not resolve to loopback 127.0.0.1:18000 -> 8000")
          services = config["services"]
          if "livekit" not in services:
              raise SystemExit("default Compose stack must include local LiveKit")
          backend_environment = services["backend"]["environment"]
          if str(backend_environment.get("ROADTALK_PTT_MEDIA_PROVIDER_ENABLED")).lower() != "true":
              raise SystemExit("default Compose backend must enable the local media provider")
          if backend_environment.get("ROADTALK_PTT_MEDIA_PROVIDER") != "livekit":
              raise SystemExit("default Compose backend must use the LiveKit adapter")
          dependencies = services["backend"].get("depends_on", {})
          if "livekit" not in dependencies:
              raise SystemExit("backend must start with the local LiveKit service")
          lan_config = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("compose-lan.json").read_text())
          lan_services = lan_config["services"]
          if "gateway" not in lan_services:
              raise SystemExit("LAN Compose override must include the HTTPS gateway")
          gateway_ports = lan_services["gateway"]["ports"]
          if not any(
              str(port.get("target")) == "8443"
              and str(port.get("published")) == "8443"
              and port.get("host_ip") == "0.0.0.0"
              for port in gateway_ports
          ):
              raise SystemExit("LAN HTTPS gateway did not resolve to 0.0.0.0:8443")
          lan_backend_environment = lan_services["backend"]["environment"]
          if lan_backend_environment.get("ROADTALK_PTT_LIVEKIT_URL") != "wss://10.0.0.25:8443/livekit":
              raise SystemExit("LAN backend must issue secure private-address LiveKit URLs")
          livekit_command = lan_services["livekit"]["command"]
          if "--node-ip" not in livekit_command or "10.0.0.25" not in livekit_command:
              raise SystemExit("LAN LiveKit must advertise the explicit private host address")
          PY
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip>=26.1.2'
          python -m pip install --disable-pip-version-check -e backend pip-audit==2.10.1
          pip-audit --local --skip-editable
      - name: Audit mobile production dependencies
        run: |
          npm ci --prefix mobile
          python scripts/ci/audit-mobile-dependencies.py
      - name: Check Sprint 2 privacy and scope
        run: python scripts/ci/check-identity-privacy.py
      - name: Check Sprint 3 location privacy and scope
        run: python scripts/ci/check-location-privacy.py
      - name: Check Sprint 4 PTT privacy and scope
        run: python scripts/ci/check-ptt-privacy.py
      - name: Check Sprint 4 PTT operations and cost controls
        run: python scripts/ci/check-ptt-operations.py
      - name: Check Sprint 4 final review and traceability
        run: python scripts/ci/check-sprint-4-review.py
      - name: Check approved Sprint 5 planning boundaries
        run: python scripts/ci/check-sprint-5-planning.py
      - name: Check Sprint 5 proximity privacy and scope
        run: python scripts/ci/check-proximity-privacy.py
      - name: Check Sprint 5 proximity hardening and evidence
        run: python scripts/ci/check-proximity-hardening.py
      - name: Check Sprint 5 final review and traceability
        run: python scripts/ci/check-sprint-5-review.py
      - name: Check approved Sprint 6 planning boundaries
        run: python scripts/ci/check-sprint-6-planning.py
      - name: Check approved Sprint 7 planning boundaries
        run: python scripts/ci/check-sprint-7-planning.py
      - name: Check Sprint 7 route-mode privacy and scope
        run: python scripts/ci/check-route-mode-privacy.py
      - name: Check Sprint 7 route-context provider boundary
        run: python scripts/ci/check-route-context-provider.py
      - name: Check Sprint 6 channel privacy and scope
        run: python scripts/ci/check-channel-privacy.py
      - name: Check Sprint 6 channel hardening and evidence
        run: python scripts/ci/check-channel-hardening.py
      - name: Check Sprint 6 final review and traceability
        run: python scripts/ci/check-sprint-6-review.py
      - name: Validate and lint Terraform
        id: terraform
        run: |
          set +e
          sh scripts/ci/validate-terraform.sh > "$RUNNER_TEMP/terraform-validation.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/terraform-validation.txt"
          if [ "$status" -ne 0 ]; then
            diagnostic="$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/terraform-validation.txt" | tail -n 4 | base64 -w0 | cut -c1-180)"
            echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Preserve Terraform validation report
        if: ${{ failure() && steps.terraform.outputs.diagnostic != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terraform-validation-${{ steps.terraform.outputs.diagnostic }}
          path: ${{ runner.temp }}/terraform-validation.txt
          retention-days: 1
      - name: Scan dependencies, secrets, Dockerfiles, and Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build backend container
        run: docker build --file backend/Dockerfile --tag roadtalk-ci:${{ github.sha }} .
      - name: Scan backend container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roadtalk-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Report gated artifacts
        run: sh scripts/ci/report-artifact-gates.sh
