name: Refresh Expo SDK patches

on:
  push:
    branches:
      - agent/s06-d08-channel-hardening

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/s06-d08-channel-hardening
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh Expo patch dependencies
        working-directory: mobile
        run: npx expo install expo@~57.0.14 expo-asset@~57.0.12 expo-dev-client@~57.0.13 expo-location@~57.0.11
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Refresh Expo SDK patch dependencies"
          git push origin HEAD:agent/s06-d08-channel-hardening
